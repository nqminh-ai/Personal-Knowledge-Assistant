project:
  name: personal-knowledge-assistant
  current_week: 1
  source_of_truth:
    - idea/proposal_v2.html
    - idea/weekly_assignment.html
    - idea/step_by_step_members.html
    - idea/week1_guide.html

week1_decisions:
  status: approved
  corpus_target:
    min_documents: 25
    target_pages: "300-500"
    required_formats:
      - pdf
      - docx
      - pptx
      - scanned_image_or_scan_pdf
    required_diversity:
      min_subjects: 3
      include_dirty_layouts: true

  metadata_schema_version: v0
  evaluation_schema_version: v0

  retrieval_mvp:
    embedding_model: BAAI/bge-m3
    vector_store: FAISS
    sparse_retrieval: BM25
    vietnamese_tokenizer: pyvi
    vietnamese_tokenizer_candidates:
      - pyvi
      - underthesea
    owner: "B - Retrieval Engineer"
    fusion_method: reciprocal_rank_fusion

  generation_mvp:
    primary_llm: gemini-3.5-flash
    llm_candidates:
      - gemini-3.5-flash
      - gpt-4o-mini_or_current_low_cost_openai_model
      - qwen_api_or_local
    owner: "C - LLM/RAG Engineer"
    citation_format: "[doc_id, page, chunk_id]"
    abstention_message: "I cannot find enough information in the provided documents."

  evaluation:
    target_questions: "280-320"
    pilot_questions: "30-50"
    min_questions_per_query_type: 45
    query_types:
      - direct_lookup
      - semantic
      - keyword_heavy
      - multi_document
      - conversational
      - no_answer
    agreement_metric: cohens_kappa
    agreement_threshold: 0.6
    owner: "D - Evaluation & Frontend"

  sync_schedule:
    frequency: daily
    time: "21:00 (9:00 PM)"
    owner: "E - PM/QA"

open_items:
  - status: resolved
    item: Choose final LLM provider -> Gemini 3.5 Flash (Owner: C)
  - status: resolved
    item: Choose Vietnamese tokenizer -> pyvi (Owner: B)
  - status: resolved
    item: Confirm sync time -> 21:00 daily (Owner: E)
  - status: resolved
    item: Collect and finalize corpus -> 41 documents collected and indexed in data/metadata/documents.csv (Owner: A)
